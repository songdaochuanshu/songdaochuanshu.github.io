name: GitHub Actions Build and Deploy
on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # 本仓库未提交 lockfile，故不开启 npm 缓存（否则 setup-node 会报找不到锁文件）

      - name: Install and Build 🔧
        # umi 3.x 依赖 webpack 4，其 md4 哈希在 Node 17+ 的 OpenSSL 3 下不可用
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm install
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.ACCESS_TOKEN }}
